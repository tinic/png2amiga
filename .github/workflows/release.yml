name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least-privilege: read-only by default, release job elevates to write
permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0  # need full history for git rev-list --count HEAD

      - name: Install GCC 15 and CMake
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          # ppa:ubuntu-toolchain-r/test's CDN has been timing out
          # intermittently; retry update + install up to 3 times.
          for i in 1 2 3; do sudo apt-get update && break; sleep 15; done
          for i in 1 2 3; do
            sudo apt-get install -y gcc-15 g++-15 cmake ninja-build python3-pil && break
            sleep 30
          done

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-15 \
            -DCMAKE_CXX_COMPILER=g++-15

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: build/png2amiga
          if-no-files-found: error

  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0  # need full history for git rev-list --count HEAD

      - name: Install GCC 15 and CMake
        run: brew install gcc@15 cmake ninja

      - name: Install Python deps for tests
        # ctest's reserve-ega-*-excl tests need Pillow to inspect the
        # encoded PNG output. Without it the tests fail with
        # ModuleNotFoundError. Use pipx-style isolation if needed —
        # macos-latest's system python is externally-managed, so we
        # use --break-system-packages (it's a CI runner, not real env).
        run: pip3 install --break-system-packages Pillow

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-15 \
            -DCMAKE_CXX_COMPILER=g++-15

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: build/png2amiga
          if-no-files-found: error

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0  # need full history for git rev-list --count HEAD

      # MSVC instead of MinGW. The MinGW UCRT64 runtime on GH-hosted
      # runners had every HAM ctest failing with 0xc0000374 (heap
      # corruption) reproducibly, while the same source + gcc 15.2.0
      # UCRT64 toolchain ran clean on a self-hosted Windows builder.
      # Switching to MSVC sidesteps the unreproducible GH-CI failure.
      # windows-latest ships Visual Studio 2022, so CMake's
      # `Visual Studio 17 2022` generator finds cl/MSBuild directly
      # without an extra setup step.
      - name: Setup Python (for Pillow in ctests)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install Pillow
        shell: bash

      - name: Show CMake version
        run: cmake --version

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: build/Release/png2amiga.exe
          if-no-files-found: error

  release:
    name: Package and publish
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble flat release zip
        run: |
          mkdir release
          cp artifacts/linux-x86_64/png2amiga       release/png2amiga-linux-x86_64
          cp artifacts/macos-arm64/png2amiga        release/png2amiga-macos-arm64
          cp artifacts/windows-x86_64/png2amiga.exe release/png2amiga-windows-x86_64.exe
          chmod +x release/png2amiga-linux-x86_64 release/png2amiga-macos-arm64
          cd release
          zip "../png2amiga-${GITHUB_REF_NAME}.zip" *
          ls -la "../png2amiga-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: png2amiga-${{ github.ref_name }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
