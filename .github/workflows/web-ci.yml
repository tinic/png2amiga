name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "service/nginx.conf"
      - ".github/workflows/web-ci.yml"
      - "CMakeLists.txt"
      - "tools/build-web.sh"
  pull_request:
    paths:
      - "web/**"
      - "src/**"
      - "service/nginx.conf"
      - ".github/workflows/web-ci.yml"
      - "CMakeLists.txt"
      - "tools/build-web.sh"
  workflow_dispatch:

# Least-privilege.
permissions:
  contents: read

# Cancel in-flight runs on the same ref so a fast follow-up commit doesn't
# pile up duplicate builds.
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + lint + typecheck + tests + e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive  # third_party/libwebp etc. are submodules
          fetch-depth: 0         # for git rev-list --count HEAD baked into version

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Emscripten — the WASM build is the source-of-truth for @wasm/png2amiga.js
      # imports; without it Vite can't bundle. Caching the SDK saves ~30s per run.
      #
      # Pinning to a specific release version avoids the `HEAD.zip` fetch path
      # the `latest` setting takes — that path occasionally 502s during GitHub
      # CDN incidents (kills the whole CI run). A pinned tag downloads from a
      # release archive that's far more reliably cached. Bump as needed.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          # 4.0.10 ships libc++ 21 — needed for <jthread> (used by
          # pipeline::parallel_for and ham.cpp's threaded encoder).
          # 3.1.74 (the prior pin) shipped libc++ 19 which doesn't
          # expose std::jthread at the -std=c++23 we use.
          version: 4.0.10
          actions-cache-folder: emsdk-cache

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build brotli

      - name: Build WASM module
        run: |
          emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release .
          cmake --build build-wasm

      - name: Install web deps (lockfile-only)
        working-directory: web
        run: npm ci --no-audit --no-fund

      # Runs the same 7-gate pipeline as tools/build-web.sh:
      #   check:bindings → vue-tsc → eslint → audit:prod → vitest → vite → check:size
      - name: Build (full pipeline)
        working-directory: web
        run: npm run build

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: web
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
