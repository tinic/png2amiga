MEMORY {
    ROM0: start = $008000, size = $8000, fill = yes, fillval = $00;
    ROM1: start = $018000, size = $8000, fill = yes, fillval = $00;
}
SEGMENTS {
    CODE:    load = ROM0, start = $008000;
    RODATA:  load = ROM0;
    HEADER:  load = ROM0, start = $00FFC0;
    VECTORS: load = ROM0, start = $00FFE0;
    BANK1:   load = ROM1;
}
