# nginx config for png2amiga web + compile backend
#
# Server: git pull into /var/www/png2amiga/
#         apt install bubblewrap
#         ln -s /var/www/png2amiga/service/nginx.conf /etc/nginx/sites-enabled/png2amiga
#         cp service/png2amiga-compile.service /etc/systemd/system/
#         systemctl daemon-reload && systemctl enable --now png2amiga-compile
#         systemctl reload nginx

# Rate limit: 2 compilations per minute per IP, burst of 4
limit_req_zone $binary_remote_addr zone=compile:1m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /var/www/png2amiga/service/html;
    index index.html;

    # Serve pre-compressed .gz files if available (no runtime compression cost)
    gzip_static on;
    # Fallback: compress on the fly for non-precompressed files
    gzip on;
    gzip_types text/css application/javascript application/wasm image/svg+xml;
    gzip_min_length 1000;

    # Security headers — applied to all routes via add_header inheritance.
    # CSP rationale (per directive — keep this comment in sync with the policy):
    #   default-src 'self'                      — only same-origin by default
    #   script-src  'self' 'wasm-unsafe-eval' 'unsafe-eval' analytics.png2amiga.app
    #                                          — WASM compile + Umami tracker.
    #                                            'unsafe-eval' is broader than we'd like
    #                                            (Umami's script.js calls eval/Function).
    #                                            CSP can't scope 'unsafe-eval' to one host;
    #                                            audit Umami later or self-host an eval-free
    #                                            tracker to drop this. The remaining
    #                                            directives (frame-ancestors, object-src,
    #                                            base-uri, form-action) still provide value.
    #   style-src   'self' 'unsafe-inline' fonts.googleapis.com
    #                                          — PrimeVue/Vue inline styles + Google Fonts CSS
    #   font-src    'self' data: fonts.gstatic.com
    #                                          — PrimeIcons (data:) + Google Fonts WOFF
    #   img-src     'self' data: blob:         — example PNGs + canvas blobs
    #   connect-src 'self' analytics.png2amiga.app
    #                                          — same-origin fetch + Umami event POSTs
    #   worker-src  'self' blob:               — Vite-built workers load via blob:
    #   frame-ancestors 'none'                  — block embedding (clickjacking)
    #   form-action 'none'                      — no <form> submissions
    #   base-uri    'self'                      — pin <base> tag if present
    #   object-src  'none'                      — no <object>/<embed>/<applet>
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' https://analytics.png2amiga.app; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://analytics.png2amiga.app; worker-src 'self' blob:; frame-ancestors 'none'; form-action 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compile API proxy (sandboxed, rate-limited)
    location /api/compile {
        limit_req zone=compile burst=4 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        client_max_body_size 5m;
    }
}
