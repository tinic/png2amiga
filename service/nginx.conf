# nginx config for png2amiga web + compile backend
#
# Server: git pull into /var/www/png2amiga/
#         ln -s /var/www/png2amiga/service/nginx.conf /etc/nginx/sites-enabled/png2amiga
#         python3 /var/www/png2amiga/service/compile.py &
#         systemctl reload nginx

server {
    listen 80;
    server_name _;

    root /var/www/png2amiga/service/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compile API proxy
    location /api/compile {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        client_max_body_size 50m;
    }
}
