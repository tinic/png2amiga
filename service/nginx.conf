# nginx config for png2amiga web + compile backend
#
# Server: git pull into /var/www/png2amiga/
#         apt install bubblewrap libnginx-mod-http-brotli-filter \
#                                 libnginx-mod-http-brotli-static
#         ln -s /var/www/png2amiga/service/nginx.conf /etc/nginx/sites-enabled/png2amiga
#         cp service/png2amiga-compile.service /etc/systemd/system/
#         systemctl daemon-reload && systemctl enable --now png2amiga-compile
#         systemctl reload nginx
#
# Note: brotli is split into two Debian packages, both required:
#   libnginx-mod-http-brotli-static  → brotli_static (serves .br files)
#   libnginx-mod-http-brotli-filter  → brotli on / brotli_types
#                                       (on-the-fly for HTML / dynamic)
# Without them nginx fails to start with "unknown directive
# brotli_static" / "unknown directive brotli". Both are in trixie's
# main repo, not nginx-extras — easy to miss.

# Rate limit: 2 compilations per minute per IP, burst of 4
limit_req_zone $binary_remote_addr zone=compile:1m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /var/www/png2amiga/service/html;
    index index.html;

    # Serve pre-compressed .br / .gz if available — both shipped by
    # the Vite build for every .js / .css / .wasm. Brotli is preferred
    # (~20% smaller); gzip is the universal fallback for clients
    # that don't advertise `br`. No runtime compression cost.
    brotli_static on;
    gzip_static on;
    # Fallback: compress on the fly for non-precompressed responses
    # (HTML, dynamic API output).
    brotli on;
    brotli_types text/css application/javascript application/wasm image/svg+xml text/html;
    gzip on;
    gzip_types text/css application/javascript application/wasm image/svg+xml;
    gzip_min_length 1000;

    # Security headers — applied to all routes via add_header inheritance.
    # CSP rationale (per directive — keep this comment in sync with the policy):
    #   default-src 'self'                      — only same-origin by default
    #   script-src  'self' 'wasm-unsafe-eval' 'unsafe-eval' analytics.png2amiga.app
    #                                          — WASM compile + Umami tracker.
    #                                            'unsafe-eval' is broader than we'd like
    #                                            (Umami's script.js calls eval/Function).
    #                                            CSP can't scope 'unsafe-eval' to one host;
    #                                            audit Umami later or self-host an eval-free
    #                                            tracker to drop this. The remaining
    #                                            directives (frame-ancestors, object-src,
    #                                            base-uri, form-action) still provide value.
    #   style-src   'self' 'unsafe-inline'      — PrimeVue/Vue inline styles. Inter is
    #                                            now self-hosted (@fontsource/inter →
    #                                            bundled into /assets/), so no Google
    #                                            Fonts host needed.
    #   font-src    'self' data:                — Inter WOFF2 (self-hosted, fingerprinted)
    #                                            + PrimeIcons (data: URI in the CSS).
    #   img-src     'self' data: blob:         — example PNGs + canvas blobs
    #   connect-src 'self' analytics.png2amiga.app
    #                                          — same-origin fetch + Umami event POSTs
    #   worker-src  'self' blob:               — Vite-built workers load via blob:
    #   frame-ancestors 'none'                  — block embedding (clickjacking)
    #   form-action 'none'                      — no <form> submissions
    #   base-uri    'self'                      — pin <base> tag if present
    #   object-src  'none'                      — no <object>/<embed>/<applet>
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' https://analytics.png2amiga.app; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://analytics.png2amiga.app; worker-src 'self' blob:; frame-ancestors 'none'; form-action 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # COEP `require-corp` is the broadly-supported flavour of cross-origin
    # isolation: Safari (incl. iOS) and older Firefox don't support
    # `credentialless` yet, so the previous setting left those browsers
    # without SharedArrayBuffer → our `-pthread` WASM hung at
    # "Loading converter…". `require-corp` works everywhere but demands
    # that every cross-origin resource ships a Cross-Origin-Resource-Policy
    # header. Inter fonts are self-hosted; the Umami tracker on
    # analytics.png2amiga.app is on the same server and that vhost adds
    #   add_header Cross-Origin-Resource-Policy "cross-origin" always;
    # so its `<script>` and `/api/send` POSTs satisfy require-corp.
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Fingerprinted assets (Vite emits hash-suffixed filenames for
    # everything under /assets/). Content is immutable for the life
    # of the file — when the bundle changes the filename changes
    # too — so browsers can cache forever without revalidation.
    # Saves a conditional GET per asset (~8 RTTs / page navigation)
    # on return visits.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Re-emit the security headers add_header inherits from the
        # server block — nginx replaces (not merges) the inherited
        # list once a location adds any header of its own.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' https://analytics.png2amiga.app; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://analytics.png2amiga.app; worker-src 'self' blob:; frame-ancestors 'none'; form-action 'none'; base-uri 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri =404;
    }

    # index.html must NEVER be long-cached — it's the unfingerprinted
    # entry point that references the current asset hashes. Browsers
    # should revalidate on every visit so a new deploy lands the next
    # time the user hits the page, even if the .html file itself is
    # still in cache.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        # Same header re-emission for the same reason as /assets/.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' https://analytics.png2amiga.app; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://analytics.png2amiga.app; worker-src 'self' blob:; frame-ancestors 'none'; form-action 'none'; base-uri 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compile API proxy (sandboxed, rate-limited)
    location /api/compile {
        limit_req zone=compile burst=4 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        # Largest legitimate generator output is ~977 KB (vga-12h
        # 640×480×4 plane hex-encoded source). 1.5 MB gives ~50%
        # headroom and matches the Python-side MAX_BODY constant.
        client_max_body_size 1500k;
    }
}
